<style>

      background: linear-gradient(180deg, #fff8f7 0%, #ffdde2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .chat-container {
      height: calc(100vh - 144px);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .heart-burst {
      pointer-events: none;
    }
    .bouncy-hover:active {
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="font-body-md text-on-surface">
<!-- Top AppBar: Return dog icon and user nickname -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-[0_8px_32px_rgba(168,155,157,0.12)]">
<div class="flex justify-between items-center w-full px-5 py-4 max-w-md mx-auto">
<div class="flex items-center gap-3">
<button class="bouncy-hover text-primary p-1">
<span class="material-symbols-outlined" data-icon="paws">Rows</span>
</button>
<div class="flex flex-col">
<h1 class="font-display-title text-display-title text-primary">糯米妈妈</h1>
<span class="text-[10px] font-label-caps text-outline uppercase tracking-widest">在线</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="bouncy-hover text-primary">
<span class="material-symbols-outlined" data-icon="videocam">videocam</span>
</button>
<button class="bouncy-hover text-primary">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</header>
<!-- Chat History Canvas -->
<main class="chat-container mt-20 overflow-y-auto px-margin-page pb-10 space-y-6">
<!-- Date Indicator -->
<div class="flex justify-center">
<span class="bg-surface-container-low px-3 py-1 rounded-full text-[10px] font-label-caps text-outline uppercase tracking-tighter">Today, 2:45 PM</span>
</div>
<!-- Receiver Message (Left) -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-secondary-container flex-shrink-0 overflow-hidden shadow-sm">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A close-up portrait of a fluffy white Samoyed dog with a gentle expression and dark eyes. The lighting is soft and warm, highlighting the texture of its fur against a creamy pastel background. The image has a dreamlike, healing aesthetic consistent with a premium pet lifestyle application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHM1mD3NptkwmQGVyF2NL10zze1jZzRdtKzb5dwV1oMJJUJY7Pz9rcDsf6cdKDT3bvC41iQ9ipnT0QSm00tISvca91K3jmyD6t4SFEHepT1rawL6Ua5fEmUFCmaGBUDq5E6AGWSl5z40k-nKHP-o4mN89flOrQb34h6jX0ehUVWFuQYxZgQaKNL_CQNr_0pptY8Gy39FU7vqUIOHuv7hqTjbg6OcaVrmbROAi5gz824T-SmZMAOHLhvE_k7rALjxPxAac0aDb8WJEn"/>
</div>
<div class="bg-secondary-container text-on-secondary-container px-4 py-3 rounded-[16px] rounded-bl-none shadow-[0_4px_12px_rgba(168,155,157,0.08)]">
<p class="font-body-md">你好呀！糯米准备好今天去公园参加聚会了吗？🐾</p>
</div>
</div>
<!-- Sender Message (Right) -->
<div class="flex flex-row-reverse items-end gap-2 max-w-[85%] ml-auto">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex-shrink-0 overflow-hidden shadow-sm">
<img alt="Owner Avatar" class="w-full h-full object-cover" data-alt="A portrait of a smiling young woman with soft features, looking affectionately at the camera. The setting is a sun-drenched outdoor garden with blurred greenery and pastel flowers. The overall mood is peaceful and happy, using a warm color palette of pinks and creams." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLr2yc4XLLFKo7O22zlfIak7xFHgaIlKrSa0Wp-FpxVlJ_Iwpm0GFJearLoDmsYOz7QYnhWFIJxfdDTeTC3JKw_TPCFOhWqA1wMpggujFDhtJ6Fcxka1vmBKzDxlFbZeEHeGZrhkNOmoPQIzl2BpnACxxtM2TT7m-MgXjtga7tVVolceVmXE5BcI3LVRJG1aSGlG3EUmgoy0k8JJj-4gllJopClTfWtAe2koyDMRv7Vr7gJ8uAod5Rsm4oWWYVn31aNH6UfCFonyux"/>
</div>
<div class="bg-primary-container text-on-primary-container px-4 py-3 rounded-[16px] rounded-br-none shadow-[0_4px_12px_rgba(168,155,157,0.1)]">
<p class="font-body-md">她可兴奋啦！嘴里已经叼着她最喜欢的骨头了。😂</p>
</div>
</div>
<!-- Receiver Message (Left) -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-secondary-container flex-shrink-0 overflow-hidden shadow-sm">
<img alt="User Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvwrETVL8gPsvJjyu777vOLAkavHz80WzsHxD16blI-q0keMxDeJ3wTiq3Vf4uyyUnt5hPSov9icp8jDUpnXOXOQvp7iV0BcBwzMap4C4-WzmCifTp97bvyPTUzd6kTzjfle7L2EAa2u_uSvP8NyflAyn0N0Q1VLEYhBVaINRZ5ABMOQqcNMMnqbLp7iImHuGsVjSZWEEVHtJ9irKXS5EZ--KbadbITtK0s2YGs6O4osMtTNzCNRRNNKOiU3DjuR6uyqArzZ1qNWcs"/>
</div>
<div class="bg-secondary-container text-on-secondary-container px-4 py-3 rounded-[16px] rounded-bl-none shadow-[0_4px_12px_rgba(168,155,157,0.08)]">
<p class="font-body-md">太可爱了！我15分钟后就到，待会见！❤️</p>
</div>
</div>
<!-- Image Message (Sender) -->
<div class="flex flex-row-reverse items-end gap-2 max-w-[85%] ml-auto">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex-shrink-0 overflow-hidden shadow-sm">
<img alt="Owner Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAThIBCGeS-F12Rw6FfOSXQ_q3elG6TEEu5NqzifS-LFan-4KbBG2QhBMNJ-D-L9Ag-WjpD5NOAOD6SwZvByBOFeTvOxNRGuXE0xeCsUlHIP6tZ3Cmk0bbAOUEo5Riy7x5Ggtk0234g27RF5bPenM8TZDVlXLk8S60gXr_MXtkwKux6mTNQ3rmuFZD_TvUehhEaJiqf4zJsdgQOPRzZQlX2PgeGAvYvohhtctWsGsPYZet9t67K1cjSPALWFJT9VplMfphL8rlleaZz"/>
</div>
<div class="bg-primary-container p-1 rounded-[16px] rounded-br-none shadow-[0_4px_12px_rgba(168,155,157,0.1)]">
<div class="rounded-[12px] overflow-hidden">
<img alt="Mochi waiting" class="w-full max-w-[200px] object-cover h-40" data-alt="A small, adorable Shiba Inu puppy sitting patiently by a wooden front door, wearing a tiny red bandana. The dog is looking up with wide, sparkling eyes. The floor is covered in soft afternoon sunlight, creating long shadows and a cozy, inviting atmosphere in a soft-ui style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBi9BWr3uvtOo9u1BdUwv-XqE1gIUmT3csmWGaZHTckWRlZ4EkpJQYdK_qkYWxF1un-E_vSNGflrnxctVW3pZ9TU0STDaGsoZGGq0Um345U9lcLIFn5Asr7B6igXnd0P1gvynJkanIyCsBwAg_Eq5x-Ghj8PFxxFqAxFpGJx-7ploOAMX1pES9WsSKT0KJqEEbNIc5e3UvTEDW4TAlHTC51XWSfjcWCcm9MWKZ9JtLrV3YcR33e9GLXy4rrnaOSr6HXSfAeUuiOCK46"/>
</div>
</div>
</div>
</main>
<!-- Bottom Input Area -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 px-4 pt-3 pb-safe z-50 shadow-[0_-4px_16px_rgba(168,155,157,0.08)]">
<div class="max-w-md mx-auto flex items-center gap-2 mb-2">
<!-- Plus Action -->
<button class="bouncy-hover w-10 h-10 flex items-center justify-center text-primary bg-primary-container rounded-full">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<!-- Input Field -->
<div class="flex-1 relative group">
<input class="w-full h-11 bg-surface-container-low border-none rounded-full px-5 text-body-md focus:ring-2 focus:ring-primary-fixed ring-inset transition-all placeholder:text-outline/50" placeholder="和主人聊一聊吧～" type="text"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-primary/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mood">mood</span>
</button>
</div>
<!-- Send Button -->
<button class="bouncy-hover w-11 h-11 flex items-center justify-center bg-primary text-on-primary rounded-full shadow-lg">
<span class="material-symbols-outlined transform rotate-[-45deg] translate-x-0.5" data-icon="send">send</span>
</button>
</div>
<!-- Quick Reply Bubble suggestions -->
<div class="flex gap-2 pb-2 overflow-x-auto no-scrollbar">
<button class="flex-shrink-0 px-4 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-full text-[11px] font-label-caps border border-tertiary-fixed-dim/30">汪汪！🦴</button>
<button class="flex-shrink-0 px-4 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-full text-[11px] font-label-caps border border-tertiary-fixed-dim/30">在路上啦！🐾</button>
<button class="flex-shrink-0 px-4 py-1.5 bg-tertiary-container text-on-tertiary-container rounded-full text-[11px] font-label-caps border border-tertiary-fixed-dim/30">真可爱！❤️</button>
</div>
</footer>
<!-- Subtle Heart Burst Particle Overlay (Hidden by default, used for interaction concept) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-[100] opacity-0">
<span class="material-symbols-outlined text-primary-fixed-dim absolute top-1/2 left-1/2 animate-bounce" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</body></html>
