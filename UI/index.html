<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>WaggleWorld - 宠物社交小程序</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#71585c",
            "primary-light": "#dfbfc3",
            secondary: "#655e43",
            tertiary: "#546254",
            surface: "#fff8f7",
            "on-surface": "#1e1b1b",
            "surface-variant": "#e8e1e1",
            error: "#ba1a1a"
          },
          fontFamily: {
            body: ["Nunito Sans", "sans-serif"],
            headline: ["Quicksand", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .fill { font-variation-settings: 'FILL' 1; }
    .hide { display: none !important; }
    .show { display: block !important; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-surface min-h-screen font-body">
  <!-- Loading -->
  <div id="loading" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
    <div class="text-center">
      <span class="material-symbols-outlined text-6xl text-primary spin">pets</span>
      <p class="mt-4 text-primary font-headline">加载中...</p>
    </div>
  </div>

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-white/95 backdrop-blur-sm shadow-sm z-50">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-2xl text-primary fill">pets</span>
        <h1 class="font-headline font-bold text-lg text-on-surface">WaggleWorld</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="showSearch()" class="p-2 rounded-full hover:bg-surface-variant transition">
          <span class="material-symbols-outlined text-on-surface">search</span>
        </button>
        <button onclick="showNotifications()" class="p-2 rounded-full hover:bg-surface-variant transition relative">
          <span class="material-symbols-outlined text-on-surface">notifications</span>
          <span id="notif-badge" class="absolute top-1 right-1 w-4 h-4 bg-error text-white text-[10px] rounded-full flex items-center justify-center hide">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="pt-14 pb-16 min-h-screen">
    <!-- Home Page -->
    <div id="page-home" class="page px-4 py-4 fade-in">
      <div class="mb-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-headline font-bold text-xl text-on-surface">附近好去处</h2>
          <button onclick="showAllPlaces()" class="text-sm text-primary">查看全部</button>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="place-filters">
          <button class="filter-btn active px-4 py-2 bg-primary text-white rounded-full text-sm whitespace-nowrap transition" data-type="">全部</button>
          <button class="filter-btn px-4 py-2 bg-surface-variant text-on-surface rounded-full text-sm whitespace-nowrap transition" data-type="park">🌳 公园</button>
          <button class="filter-btn px-4 py-2 bg-surface-variant text-on-surface rounded-full text-sm whitespace-nowrap transition" data-type="cafe">☕ 咖啡</button>
          <button class="filter-btn px-4 py-2 bg-surface-variant text-on-surface rounded-full text-sm whitespace-nowrap transition" data-type="hospital">🏥 医院</button>
          <button class="filter-btn px-4 py-2 bg-surface-variant text-on-surface rounded-full text-sm whitespace-nowrap transition" data-type="shop">🛍️ 商店</button>
        </div>
      </div>
      
      <div id="places-list" class="space-y-3 mb-6"></div>

      <div class="mb-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-headline font-bold text-xl text-on-surface">养宠攻略</h2>
          <button onclick="showAllGuides()" class="text-sm text-primary">查看全部</button>
        </div>
      </div>
      <div id="guides-list" class="space-y-3"></div>
    </div>

    <!-- Circle Page -->
    <div id="page-circle" class="page hide px-4 py-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-headline font-bold text-xl text-on-surface">萌宠圈</h2>
        <button onclick="showCreatePost()" class="bg-primary text-white px-4 py-2 rounded-full text-sm flex items-center gap-1 shadow-lg">
          <span class="material-symbols-outlined text-lg">add</span> 发布
        </button>
      </div>
      <div id="posts-list" class="space-y-4"></div>
      <div id="posts-empty" class="hide text-center py-12 text-on-surface-variant">
        <span class="material-symbols-outlined text-4xl mb-2">article</span>
        <p>暂无动态</p>
      </div>
    </div>

    <!-- Message Page -->
    <div id="page-message" class="page hide px-4 py-4">
      <h2 class="font-headline font-bold text-xl text-on-surface mb-4">消息</h2>
      <div id="conversations-list" class="space-y-2"></div>
      <div id="conversations-empty" class="hide text-center py-12 text-on-surface-variant">
        <span class="material-symbols-outlined text-4xl mb-2">chat</span>
        <p>暂无消息</p>
      </div>
    </div>

    <!-- Profile Page -->
    <div id="page-profile" class="page hide px-4 py-4">
      <div class="bg-white rounded-2xl p-6 mb-4 shadow-sm">
        <div class="flex items-center gap-4">
          <div id="profile-avatar" class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
            <span class="material-symbols-outlined text-3xl text-on-surface-variant">person</span>
          </div>
          <div class="flex-1">
            <h2 id="profile-name" class="font-headline font-bold text-lg text-on-surface">点击登录</h2>
            <p id="profile-signature" class="text-sm text-on-surface-variant mt-1">登录后体验更多功能</p>
          </div>
          <button onclick="showEditProfile()" class="p-2 rounded-full hover:bg-surface-variant transition">
            <span class="material-symbols-outlined text-on-surface-variant">edit</span>
          </button>
        </div>
        <div id="profile-stats" class="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-surface-variant hide">
          <div class="text-center">
            <div class="font-bold text-on-surface" id="stat-posts">0</div>
            <div class="text-xs text-on-surface-variant">动态</div>
          </div>
          <div class="text-center">
            <div class="font-bold text-on-surface" id="stat-followers">0</div>
            <div class="text-xs text-on-surface-variant">粉丝</div>
          </div>
          <div class="text-center">
            <div class="font-bold text-on-surface" id="stat-following">0</div>
            <div class="text-xs text-on-surface-variant">关注</div>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <button onclick="showMyPets()" class="w-full flex items-center justify-between p-4 bg-white rounded-xl shadow-sm active:bg-surface-variant transition">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary fill">pets</span>
            <span class="text-on-surface">我的宠物</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </button>
        <button onclick="showMyPosts()" class="w-full flex items-center justify-between p-4 bg-white rounded-xl shadow-sm active:bg-surface-variant transition">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">article</span>
            <span class="text-on-surface">我的动态</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </button>
        <button onclick="showMyFavorites()" class="w-full flex items-center justify-between p-4 bg-white rounded-xl shadow-sm active:bg-surface-variant transition">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">bookmark</span>
            <span class="text-on-surface">我的收藏</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </button>
        <button onclick="showAIHelper()" class="w-full flex items-center justify-between p-4 bg-white rounded-xl shadow-sm active:bg-surface-variant transition">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-tertiary">smart_toy</span>
            <span class="text-on-surface">AI养宠助手</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </button>
        <button onclick="showSettings()" class="w-full flex items-center justify-between p-4 bg-white rounded-xl shadow-sm active:bg-surface-variant transition">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">settings</span>
            <span class="text-on-surface">设置</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-surface-variant safe-bottom z-50">
    <div class="flex items-center justify-around h-14">
      <button onclick="switchPage('home')" class="tab-btn flex flex-col items-center justify-center w-16 h-full text-primary" data-page="home">
        <span class="material-symbols-outlined fill">home</span>
        <span class="text-[10px] mt-0.5">首页</span>
      </button>
      <button onclick="switchPage('circle')" class="tab-btn flex flex-col items-center justify-center w-16 h-full text-on-surface-variant" data-page="circle">
        <span class="material-symbols-outlined">forum</span>
        <span class="text-[10px] mt-0.5">萌宠圈</span>
      </button>
      <button onclick="switchPage('message')" class="tab-btn flex flex-col items-center justify-center w-16 h-full text-on-surface-variant relative" data-page="message">
        <span class="material-symbols-outlined">chat</span>
        <span class="text-[10px] mt-0.5">消息</span>
        <span id="msg-badge" class="absolute top-1 right-2 w-4 h-4 bg-error text-white text-[10px] rounded-full flex items-center justify-center hide">0</span>
      </button>
      <button onclick="switchPage('profile')" class="tab-btn flex flex-col items-center justify-center w-16 h-full text-on-surface-variant" data-page="profile">
        <span class="material-symbols-outlined">person</span>
        <span class="text-[10px] mt-0.5">我的</span>
      </button>
    </div>
  </nav>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 z-[60] hide flex items-end justify-center">
    <div class="bg-white rounded-t-3xl w-full max-w-lg p-6 pb-8 fade-in">
      <div class="w-10 h-1 bg-surface-variant rounded-full mx-auto mb-6"></div>
      <h3 class="font-headline font-bold text-xl text-on-surface text-center mb-6">登录</h3>
      <div class="space-y-4">
        <div>
          <input type="tel" id="login-phone" placeholder="请输入手机号" maxlength="11" class="w-full px-4 py-3 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <input type="password" id="login-password" placeholder="请输入密码" class="w-full px-4 py-3 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <button onclick="handleLogin()" class="w-full bg-primary text-white py-3 rounded-xl font-bold shadow-lg active:scale-[0.98] transition">登录</button>
        <p class="text-center text-sm text-on-surface-variant">
          还没有账号？<button onclick="showRegister()" class="text-primary font-semibold">立即注册</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="register-modal" class="fixed inset-0 bg-black/50 z-[60] hide flex items-end justify-center">
    <div class="bg-white rounded-t-3xl w-full max-w-lg p-6 pb-8 fade-in">
      <div class="w-10 h-1 bg-surface-variant rounded-full mx-auto mb-6"></div>
      <h3 class="font-headline font-bold text-xl text-on-surface text-center mb-6">注册</h3>
      <div class="space-y-4">
        <div>
          <input type="text" id="register-username" placeholder="请输入用户名" maxlength="20" class="w-full px-4 py-3 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <input type="tel" id="register-phone" placeholder="请输入手机号" maxlength="11" class="w-full px-4 py-3 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <input type="password" id="register-password" placeholder="请输入密码（6-20位）" class="w-full px-4 py-3 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <button onclick="handleRegister()" class="w-full bg-primary text-white py-3 rounded-xl font-bold shadow-lg active:scale-[0.98] transition">注册</button>
        <p class="text-center text-sm text-on-surface-variant">
          已有账号？<button onclick="showLogin()" class="text-primary font-semibold">立即登录</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div id="create-post-modal" class="fixed inset-0 bg-black/50 z-[60] hide flex items-end justify-center">
    <div class="bg-white rounded-t-3xl w-full max-w-lg p-6 pb-8 fade-in">
      <div class="w-10 h-1 bg-surface-variant rounded-full mx-auto mb-6"></div>
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeCreatePost()" class="text-on-surface-variant">取消</button>
        <h3 class="font-headline font-bold text-lg text-on-surface">发布动态</h3>
        <button onclick="submitPost()" class="text-primary font-bold">发布</button>
      </div>
      <textarea id="post-content" placeholder="分享你的宠物日常..." rows="5" class="w-full p-4 bg-surface rounded-xl border-0 focus:ring-2 focus:ring-primary outline-none resize-none"></textarea>
    </div>
  </div>

  <!-- AI Helper Modal -->
  <div id="ai-modal" class="fixed inset-0 bg-white z-[60] hide flex flex-col">
    <header class="flex items-center justify-between px-4 h-14 border-b border-surface-variant">
      <button onclick="closeAIModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
      <h3 class="font-headline font-bold text-lg text-on-surface">AI养宠助手</h3>
      <div class="w-8"></div>
    </header>
    <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="bg-surface-variant rounded-2xl rounded-tl-none p-4 max-w-[80%] fade-in">
        <p class="text-on-surface">你好！我是AI养宠助手 🐾</p>
        <p class="text-on-surface mt-2">我可以帮你解答宠物饮食、健康、训练等方面的问题。有什么想问的吗？</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="askQuickQuestion('猫咪应该吃什么？')" class="px-3 py-1.5 bg-surface-variant rounded-full text-sm text-on-surface">🐱 猫咪饮食</button>
        <button onclick="askQuickQuestion('狗狗怎么训练？')" class="px-3 py-1.5 bg-surface-variant rounded-full text-sm text-on-surface">🐶 狗狗训练</button>
        <button onclick="askQuickQuestion('宠物疫苗什么时候打？')" class="px-3 py-1.5 bg-surface-variant rounded-full text-sm text-on-surface">💉 疫苗时间</button>
      </div>
    </div>
    <div class="p-4 border-t border-surface-variant safe-bottom">
      <div class="flex gap-2">
        <input type="text" id="ai-input" placeholder="输入你的问题..." class="flex-1 px-4 py-3 bg-surface rounded-full border-0 focus:ring-2 focus:ring-primary outline-none" onkeypress="if(event.key==='Enter')sendAIMessage()">
        <button onclick="sendAIMessage()" class="bg-primary text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Config
    const API_BASE = 'http://localhost:3000/api';
    let currentUser = null;
    let authToken = localStorage.getItem('authToken');
    let currentPlaceFilter = '';

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
      initFilterButtons();
      if (authToken) {
        await loadUserInfo();
        loadUnreadCount();
      }
      loadHomeData();
      setTimeout(() => {
        document.getElementById('loading').classList.add('hide');
      }, 500);
    });

    // Filter buttons
    function initFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active', 'bg-primary', 'text-white');
            b.classList.add('bg-surface-variant', 'text-on-surface');
          });
          btn.classList.add('active', 'bg-primary', 'text-white');
          btn.classList.remove('bg-surface-variant', 'text-on-surface');
          currentPlaceFilter = btn.dataset.type;
          loadPlaces();
        });
      });
    }

    // API helper
    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...opts.headers };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      try {
        const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
        return await res.json();
      } catch (e) {
        console.error('API Error:', e);
        return { success: false, message: '网络错误' };
      }
    }

    // Page switching
    function switchPage(name) {
      document.querySelectorAll('.page').forEach(p => { p.classList.add('hide'); p.classList.remove('fade-in'); });
      const page = document.getElementById(`page-${name}`);
      page.classList.remove('hide');
      page.classList.add('fade-in');

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('text-primary');
        b.classList.add('text-on-surface-variant');
        b.querySelector('.material-symbols-outlined').classList.remove('fill');
      });
      const btn = document.querySelector(`.tab-btn[data-page="${name}"]`);
      btn.classList.add('text-primary');
      btn.classList.remove('text-on-surface-variant');
      btn.querySelector('.material-symbols-outlined').classList.add('fill');

      if (name === 'home') loadHomeData();
      else if (name === 'circle') loadPosts();
      else if (name === 'message') loadConversations();
      else if (name === 'profile') loadUserInfo();
    }

    // Home
    async function loadHomeData() {
      loadPlaces();
      loadGuides();
    }

    async function loadPlaces() {
      const res = await api(`/place?size=5&type=${currentPlaceFilter}`);
      if (res.success) renderPlaces(res.data.list);
    }

    function renderPlaces(places) {
      document.getElementById('places-list').innerHTML = places.map(p => `
        <div class="bg-white rounded-xl p-4 shadow-sm" onclick="showPlaceDetail(${p.id})">
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <h3 class="font-headline font-bold text-on-surface">${p.name}</h3>
              <p class="text-sm text-on-surface-variant mt-1 line-clamp-2">${p.address}</p>
              <div class="flex items-center gap-3 mt-2">
                <span class="text-xs px-2 py-0.5 bg-surface-variant rounded-full">${getTypeName(p.type)}</span>
                <span class="text-xs text-on-surface-variant flex items-center gap-0.5">
                  <span class="material-symbols-outlined text-sm text-error fill">favorite</span>${p.likes || 0}
                </span>
                <span class="text-xs text-on-surface-variant">⭐ ${Number(p.rating || 0).toFixed(1)}</span>
              </div>
            </div>
            <button onclick="event.stopPropagation();likePlace(${p.id},this)" class="p-2 rounded-full hover:bg-surface-variant transition">
              <span class="material-symbols-outlined text-on-surface-variant">favorite_border</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function getTypeName(t) {
      return { park:'公园', cafe:'咖啡', shop:'商店', hotel:'酒店', hospital:'医院', other:'其他' }[t] || '其他';
    }

    async function loadGuides() {
      const res = await api('/guide?size=5');
      if (res.success) renderGuides(res.data.list);
    }

    function renderGuides(guides) {
      document.getElementById('guides-list').innerHTML = guides.map(g => `
        <div class="bg-white rounded-xl p-4 shadow-sm" onclick="showGuideDetail(${g.id})">
          <div class="flex gap-3">
            <div class="w-16 h-16 bg-surface-variant rounded-lg flex items-center justify-center flex-shrink-0">
              ${g.cover ? `<img src="${g.cover}" class="w-full h-full object-cover rounded-lg">` : '<span class="material-symbols-outlined text-on-surface-variant">article</span>'}
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-headline font-semibold text-on-surface line-clamp-2">${g.title}</h3>
              <div class="flex items-center gap-2 mt-2 text-xs text-on-surface-variant">
                <span>${g.pet_type === 'cat' ? '🐱' : '🐶'}</span>
                <span>${g.views_count || 0} 浏览</span>
                <span>❤️ ${g.likes_count || 0}</span>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function likePlace(id, btn) {
      if (!authToken) { showLogin(); return; }
      const res = await api(`/place/${id}/like`, { method: 'POST' });
      if (res.success) {
        const icon = btn.querySelector('.material-symbols-outlined');
        if (res.data.liked) {
          icon.textContent = 'favorite';
          icon.classList.add('fill', 'text-error');
        } else {
          icon.textContent = 'favorite_border';
          icon.classList.remove('fill', 'text-error');
        }
      }
    }

    function showPlaceDetail(id) { alert('地点详情功能开发中...'); }
    function showAllPlaces() { alert('查看更多地点功能开发中...'); }
    function showGuideDetail(id) { alert('攻略详情功能开发中...'); }
    function showAllGuides() { alert('查看更多攻略功能开发中...'); }

    // Circle
    async function loadPosts() {
      const res = await api('/post?size=10');
      if (res.success) {
        renderPosts(res.data.list);
        document.getElementById('posts-empty').classList.toggle('hide', res.data.list.length > 0);
      }
    }

    function renderPosts(posts) {
      document.getElementById('posts-list').innerHTML = posts.map(p => `
        <div class="bg-white rounded-xl p-4 shadow-sm fade-in">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden">
              ${p.avatar ? `<img src="${p.avatar}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-on-surface-variant">person</span></div>'}
            </div>
            <div class="flex-1">
              <h4 class="font-semibold text-on-surface">${p.username}</h4>
              <p class="text-xs text-on-surface-variant">${timeAgo(p.created_at)}</p>
            </div>
          </div>
          <p class="text-on-surface mb-3">${p.content}</p>
          ${p.images && p.images.length ? `<div class="grid grid-cols-3 gap-1 mb-3">${p.images.slice(0,3).map(i => `<div class="aspect-square bg-surface-variant rounded-lg overflow-hidden"><img src="${i}" class="w-full h-full object-cover"></div>`).join('')}</div>` : ''}
          <div class="flex items-center gap-4 pt-3 border-t border-surface-variant">
            <button onclick="likePost(${p.id},this)" class="flex items-center gap-1 text-on-surface-variant active:scale-95 transition">
              <span class="material-symbols-outlined">favorite_border</span>
              <span class="text-sm">${p.likes_count || 0}</span>
            </button>
            <button onclick="showPostComments(${p.id})" class="flex items-center gap-1 text-on-surface-variant">
              <span class="material-symbols-outlined">chat_bubble_outline</span>
              <span class="text-sm">${p.comments_count || 0}</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function likePost(id, btn) {
      if (!authToken) { showLogin(); return; }
      const res = await api(`/post/${id}/like`, { method: 'POST' });
      if (res.success) {
        const icon = btn.querySelector('.material-symbols-outlined');
        const count = btn.querySelector('.text-sm');
        if (res.data.liked) {
          icon.textContent = 'favorite';
          icon.classList.add('fill', 'text-error');
          count.textContent = parseInt(count.textContent) + 1;
        } else {
          icon.textContent = 'favorite_border';
          icon.classList.remove('fill', 'text-error');
          count.textContent = Math.max(0, parseInt(count.textContent) - 1);
        }
      }
    }

    function showPostComments(id) { alert('评论功能开发中...'); }
    function showCreatePost() {
      if (!authToken) { showLogin(); return; }
      document.getElementById('create-post-modal').classList.remove('hide');
    }
    function closeCreatePost() {
      document.getElementById('create-post-modal').classList.add('hide');
      document.getElementById('post-content').value = '';
    }
    async function submitPost() {
      const content = document.getElementById('post-content').value.trim();
      if (!content) { alert('请输入内容'); return; }
      const res = await api('/post', { method: 'POST', body: JSON.stringify({ content }) });
      if (res.success) {
        closeCreatePost();
        loadPosts();
      } else {
        alert(res.message);
      }
    }

    // Message
    async function loadConversations() {
      if (!authToken) { 
        document.getElementById('conversations-empty').classList.remove('hide');
        return; 
      }
      const res = await api('/message');
      if (res.success) {
        renderConversations(res.data);
        document.getElementById('conversations-empty').classList.toggle('hide', res.data.length > 0);
      }
    }

    function renderConversations(convs) {
      document.getElementById('conversations-list').innerHTML = convs.map(c => `
        <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3 active:bg-surface-variant transition" onclick="openChat(${c.user_id},'${c.username}')">
          <div class="w-12 h-12 rounded-full bg-surface-variant overflow-hidden flex-shrink-0">
            ${c.avatar ? `<img src="${c.avatar}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-on-surface-variant">person</span></div>'}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h4 class="font-semibold text-on-surface">${c.username}</h4>
              <span class="text-xs text-on-surface-variant">${timeAgo(c.last_time)}</span>
            </div>
            <p class="text-sm text-on-surface-variant truncate mt-0.5">${c.last_message || '暂无消息'}</p>
          </div>
          ${c.unread_count > 0 ? `<span class="bg-error text-white text-xs rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0">${c.unread_count > 99 ? '99+' : c.unread_count}</span>` : ''}
        </div>
      `).join('');
    }

    function openChat(userId, name) { alert(`与 ${name} 的聊天功能开发中...`); }

    // Profile
    async function loadUserInfo() {
      if (!authToken) {
        document.getElementById('profile-name').textContent = '点击登录';
        document.getElementById('profile-signature').textContent = '登录后体验更多功能';
        document.getElementById('profile-stats').classList.add('hide');
        return;
      }
      const res = await api('/user/info');
      if (res.success) {
        currentUser = res.data;
        document.getElementById('profile-name').textContent = currentUser.username;
        document.getElementById('profile-signature').textContent = currentUser.signature || '这个人很懒，什么都没写';
        document.getElementById('stat-posts').textContent = currentUser.posts_count || 0;
        document.getElementById('stat-followers').textContent = currentUser.followers_count || 0;
        document.getElementById('stat-following').textContent = currentUser.following_count || 0;
        document.getElementById('profile-stats').classList.remove('hide');
        if (currentUser.avatar) {
          document.getElementById('profile-avatar').innerHTML = `<img src="${currentUser.avatar}" class="w-full h-full object-cover">`;
        }
      }
    }

    function showLogin() { document.getElementById('login-modal').classList.remove('hide'); }
    function showRegister() { document.getElementById('login-modal').classList.add('hide'); document.getElementById('register-modal').classList.remove('hide'); }

    async function handleLogin() {
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;
      if (!phone || !password) { alert('请填写完整信息'); return; }
      const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ phone, password }) });
      if (res.success) {
        authToken = res.data.token;
        localStorage.setItem('authToken', authToken);
        document.getElementById('login-modal').classList.add('hide');
        document.getElementById('login-phone').value = '';
        document.getElementById('login-password').value = '';
        await loadUserInfo();
        loadUnreadCount();
        alert('登录成功！');
      } else {
        alert(res.message);
      }
    }

    async function handleRegister() {
      const username = document.getElementById('register-username').value.trim();
      const phone = document.getElementById('register-phone').value.trim();
      const password = document.getElementById('register-password').value;
      if (!username || !phone || !password) { alert('请填写完整信息'); return; }
      const res = await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, phone, password }) });
      if (res.success) {
        alert('注册成功，请登录');
        document.getElementById('register-modal').classList.add('hide');
        showLogin();
      } else {
        alert(res.message);
      }
    }

    function showEditProfile() { if (!authToken) { showLogin(); return; } alert('编辑资料功能开发中...'); }
    function showMyPets() { if (!authToken) { showLogin(); return; } alert('我的宠物功能开发中...'); }
    function showMyPosts() { if (!authToken) { showLogin(); return; } alert('我的动态功能开发中...'); }
    function showMyFavorites() { if (!authToken) { showLogin(); return; } alert('我的收藏功能开发中...'); }
    function showSettings() { 
      if (!authToken) { showLogin(); return; } 
      if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('authToken');
        authToken = null;
        currentUser = null;
        loadUserInfo();
        switchPage('home');
      }
    }

    // AI Helper
    function showAIHelper() { if (!authToken) { showLogin(); return; } document.getElementById('ai-modal').classList.remove('hide'); }
    function closeAIModal() { document.getElementById('ai-modal').classList.add('hide'); }

    async function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const question = input.value.trim();
      if (!question) return;
      input.value = '';

      const messages = document.getElementById('ai-messages');
      messages.innerHTML += `<div class="bg-primary text-white rounded-2xl rounded-tr-none p-4 max-w-[80%] ml-auto fade-in">${question}</div>`;
      messages.scrollTop = messages.scrollHeight;

      const res = await api('/ai/chat', { method: 'POST', body: JSON.stringify({ question }) });
      if (res.success) {
        messages.innerHTML += `<div class="bg-surface-variant rounded-2xl rounded-tl-none p-4 max-w-[80%] fade-in"><p class="text-on-surface whitespace-pre-line">${res.data.answer}</p></div>`;
        messages.scrollTop = messages.scrollHeight;
      }
    }

    function askQuickQuestion(q) {
      document.getElementById('ai-input').value = q;
      sendAIMessage();
    }

    // Notifications
    async function loadUnreadCount() {
      if (!authToken) return;
      const res = await api('/notification/unread/count');
      if (res.success && res.data.count > 0) {
        const badge = document.getElementById('notif-badge');
        badge.textContent = res.data.count > 99 ? '99+' : res.data.count;
        badge.classList.remove('hide');
      }
    }

    function showNotifications() { if (!authToken) { showLogin(); return; } alert('通知功能开发中...'); }
    function showSearch() { alert('搜索功能开发中...'); }

    // Utils
    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return `${Math.floor(diff/60000)}分钟前`;
      if (diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
      if (diff < 2592000000) return `${Math.floor(diff/86400000)}天前`;
      return dateStr.split(' ')[0];
    }
  </script>
