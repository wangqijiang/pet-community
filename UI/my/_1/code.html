<body class="font-body-md text-on-surface antialiased">

</div>

<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>

<main class="pt-24 pb-24 px-5 max-w-md mx-auto space-y-6">

<div>

</section>

<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant/30 marshmallow-shadow flex justify-around items-center px-4 h-[72px] pb-safe rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:scale-110 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-label-caps">首页</span>

<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:scale-110 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="pets">pets</span>

<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant hover:scale-110 transition-transform" href="#">

<button class="fixed right-6 bottom-24 w-14 h-14 bg-primary text-on-primary rounded-full marshmallow-shadow flex items-center justify-center bouncy-hover z-40 border-4 border-primary-container">
