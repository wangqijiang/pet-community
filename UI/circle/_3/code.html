<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&amp;family=Nunito+Sans:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-tint": "#71585c",
                        "secondary": "#655e43",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#bbcbba",
                        "surface-container-high": "#eee6e6",
                        "primary-fixed-dim": "#dfbfc3",
                        "primary-container": "#ffdde2",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#3c4a3d",
                        "on-background": "#1e1b1b",
                        "surface-dim": "#dfd8d8",
                        "inverse-surface": "#333030",
                        "tertiary-container": "#daead8",
                        "outline": "#807476",
                        "on-surface-variant": "#4f4446",
                        "on-secondary-fixed": "#201b06",
                        "on-primary-container": "#795f64",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "padding-container": "16px",
                        "stack-gap": "8px",
                        "gutter-card": "12px",
                        "unit": "4px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Quicksand"],
                        "body-md": ["Nunito Sans"],
                        "body-lg": ["Nunito Sans"],
                        "display-title": ["Quicksand"],
                        "label-caps": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-title": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #fff8f7;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .marshmallow-shadow {
            box-shadow: 0 8px 32px rgba(168, 155, 157, 0.12);
        }
        .bouncy-interaction {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bouncy-interaction:active {
            transform: scale(0.95);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-[0_8px_32px_rgba(168,155,157,0.12)] max-w-md mx-auto left-1/2 -translate-x-1/2">
<div class="flex justify-between items-center w-full px-5 py-4">
<button class="text-primary hover:scale-105 transition-transform active:scale-95 duration-200 cubic-bezier(0.34,1.56,0.64,1)">
<span class="material-symbols-outlined" data-icon="paws">pets</span>
</button>
<h1 class="font-display-title text-display-title text-primary">发布萌宠日常</h1>
<button class="text-on-surface-variant hover:scale-105 transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="pt-24 pb-32 px-5 max-w-md mx-auto">
<!-- Content Area -->
<div class="space-y-6">
<!-- Text Input Section -->
<div class="bg-surface-container-lowest rounded-[24px] p-4 marshmallow-shadow border border-outline-variant/20">
<textarea class="w-full h-40 bg-transparent border-none focus:ring-0 text-body-lg font-body-lg placeholder:text-on-surface-variant/50 resize-none" placeholder="记录自家小可爱的日常吧～🐶"></textarea>
</div>
<!-- Image Grid Section -->
<div class="grid grid-cols-3 gap-3">
<!-- Sample Uploaded Image 1 -->
<div class="aspect-square relative group bouncy-interaction">
<img alt="Golden Retriever Puppy" class="w-full h-full object-cover rounded-xl marshmallow-shadow" data-alt="A close-up shot of a fluffy golden retriever puppy with gentle brown eyes, sitting in a soft-lit indoor setting with creamy textures. The atmosphere is warm and healing, utilizing a palette of milky white and pale pink. The lighting is diffused, highlighting the soft fur and creating a sense of calm and companionship." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJndiHPuQBKuq1Tz_jiO0DElHczwyHRz_LEOC2tfVmlZkqS73MBVPHg-RsLbu6t-sE_mXJi52ke3yncZvli11yaBMIxPL87iu1CSSkS9bTvuh4Rf5AF0zLBSTsUf8zvX7UV-6Wcz3-HFUBs6W1y5Sho-sssmGoYETc1s4T6L0F4P7HFhqMCcXqONiCR9uDP9hy4vRXR39DZVmXG0sclvFDpCuNiBAm_GvgWFeCNbUBPNpee7lVdyvLJN4mAl5KqpNiyVklXtm25jbH"/>
<button class="absolute -top-1 -right-1 bg-error text-on-error rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined !text-[14px]" data-icon="close">close</span>
</button>
</div>
<!-- Sample Uploaded Image 2 -->
<div class="aspect-square relative group bouncy-interaction">
<img alt="Beagle Dog" class="w-full h-full object-cover rounded-xl marshmallow-shadow" data-alt="A delightful beagle dog lying on a soft pale yellow blanket in a sun-drenched room. The image conveys a sense of peaceful pet life with organic shapes and soft focus backgrounds. The color theme includes pastel yellow and soft white, maintaining a healing and marshmallow-like visual aesthetic for a pet community app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnk4K3jn6CIDJmRST70yndOpn_K9e894pzSlyyuhpwmWZ3FE7quw4S97xbHEAaTGaLBfflOUIvSnFMJ9t1tikJRvds2Cw-Jr9HyGDw1JyvLelkRKNrWYSsPacm7zjBuOGogozx_Vjkf62KNH8OIhCGt64xpaVis74_cTAyTnBXOvFPvvST6jIRJWSlKvjPAN4DOnm8swKRXc7_auU103ikI9tRNmQ_x1HUAtB42JNmnG34GIN_cqsmI7ywPWN2JI7zJjCYGpjlkb7-"/>
<button class="absolute -top-1 -right-1 bg-error text-on-error rounded-full p-1 shadow-sm">
<span class="material-symbols-outlined !text-[14px]" data-icon="close">close</span>
</button>
</div>
<!-- Upload Trigger Button -->
<button class="aspect-square bg-secondary-container/30 border-2 border-dashed border-secondary-container flex flex-col items-center justify-center rounded-xl bouncy-interaction group">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="add_a_photo">add_a_photo</span>
<span class="text-label-caps font-label-caps text-secondary mt-1">2/9</span>
</button>
</div>
<!-- Categories / Tags Section -->
<div class="space-y-3">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="sell">sell</span>
                    选择分类
                </h3>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-2 bg-primary-container text-on-primary-container rounded-full font-body-md marshmallow-shadow border border-primary/10 bouncy-interaction">
                        日常萌照
                    </button>
<button class="px-6 py-2 bg-tertiary-container text-on-tertiary-container rounded-full font-body-md marshmallow-shadow border border-tertiary/10 bouncy-interaction">
                        训练日常
                    </button>
<button class="px-6 py-2 bg-secondary-container/50 text-on-secondary-container rounded-full font-body-md marshmallow-shadow border border-secondary/10 bouncy-interaction">
                        寻狗求助
                    </button>
</div>
</div>
<!-- Additional Options Card -->
<div class="bg-surface-container-low rounded-xl p-4 space-y-4 marshmallow-shadow">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<span class="text-body-md font-body-md">你在哪里？</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40" data-icon="chevron_right">chevron_right</span>
</div>
<div class="h-[1px] bg-outline-variant/30 w-full"></div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="visibility">visibility</span>
<span class="text-body-md font-body-md">公开范围</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant/60">
<span class="text-label-caps font-label-caps">所有人可见</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full p-5 bg-gradient-to-t from-surface to-transparent max-w-md mx-auto left-1/2 -translate-x-1/2">
<button class="w-full py-4 bg-primary-fixed text-on-primary-fixed rounded-[20px] font-display-title text-display-title marshmallow-shadow bouncy-interaction flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="send">send</span>
            确认发布
        </button>
</div>
<!-- BottomNavBar (Hidden in publish mode per requirements, but shell structure kept if needed for top destinations) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 h-[72px] pb-safe bg-surface-container-lowest dark:bg-surface-container-low border-t border-outline-variant/30 shadow-[0_-4px_16px_rgba(168,155,157,0.08)] rounded-t-xl opacity-0 pointer-events-none">
<!-- Hidden as this is a transactional task page -->
</nav>
</body></html>
