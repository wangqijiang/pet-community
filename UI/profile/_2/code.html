<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .marshmallow-shadow {
            box-shadow: 0 8px 32px rgba(168, 155, 157, 0.12);
        }
        .active-sink:active {
            transform: scale(0.96);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-5 py-4 flex items-center justify-between marshmallow-shadow">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active-sink">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back_ios_new</span>
</button>
<h1 class="font-display-title text-display-title text-primary">个人资料编辑</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-1 px-5 py-8 max-w-md mx-auto w-full">
<!-- Avatar Upload Section -->
<div class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-primary-container to-secondary-container marshmallow-shadow">
<img alt="Avatar" class="w-full h-full rounded-full object-cover border-4 border-white" data-alt="A close-up portrait of a fluffy golden retriever puppy with a soft, warm lighting filter. The dog has an adorable expression, sitting in a cozy indoor setting with pastel pink and milky white background colors. The aesthetic is extremely soft and healing, matching a high-end pet social media application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLI_TiM-8WkRvWXF3zLl5insv5qwVJ4DP31d8Q83fyEoVhUn_p6EhyrL8P0oYHRYOG2C1EPGovSFDuRKtZEElf6Y3ekMCuXhCm6H8p7E-l9_uww9SEPQfSsuoH443tOg2AqsKTHZrtbleJrTmiyS4ihH0gnl-qs0p-HNYLLCj5ot5DckDWouuxn5prB2VnphtZOod7ht2zORDkmjR6121rLQSrVbmjT1rRu_5fuHxsf3EQVXzfFyXg3aya8R59XZAm0hfx9yP53yyg"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center border-4 border-surface marshmallow-shadow active-sink">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit</span>
</button>
</div>
<p class="mt-4 font-label-caps text-label-caps text-on-surface-variant">点击更换头像</p>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Nickname Field -->
<div class="space-y-2">
<label class="px-4 font-label-caps text-label-caps text-primary">昵称</label>
<div class="relative">
<input class="w-full h-14 px-6 bg-surface-container-lowest border-none rounded-3xl text-body-lg font-body-lg text-on-surface marshmallow-shadow focus:ring-2 focus:ring-primary-container focus:bg-secondary-container/20 transition-all placeholder:text-outline-variant" placeholder="输入你的昵称" type="text" value="小柴汪汪"/>
<div class="absolute right-6 top-1/2 -translate-y-1/2 text-primary/40">
<span class="material-symbols-outlined">pets</span>
</div>
</div>
</div>
<!-- User ID Display (Non-editable) -->
<div class="space-y-2">
<label class="px-4 font-label-caps text-label-caps text-primary">用户 ID</label>
<div class="w-full h-14 px-6 flex items-center justify-between bg-surface-container-low/50 border border-outline-variant/30 rounded-3xl">
<span class="font-body-lg text-on-surface-variant/70">Waggle_882934</span>
<button class="text-primary hover:bg-primary/5 p-2 rounded-full transition-colors active-sink">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
</button>
</div>
</div>
<!-- Bio Field -->
<div class="space-y-2">
<label class="px-4 font-label-caps text-label-caps text-primary">个性签名</label>
<textarea class="w-full p-6 bg-surface-container-lowest border-none rounded-3xl text-body-md font-body-md text-on-surface marshmallow-shadow focus:ring-2 focus:ring-primary-container transition-all resize-none placeholder:text-outline-variant" placeholder="分享一下你和毛孩子的故事吧..." rows="3"></textarea>
</div>
</div>
<!-- Tips Card -->
<div class="mt-10 p-6 bg-tertiary-container/30 rounded-3xl border border-tertiary-container/50 flex gap-4">
<span class="material-symbols-outlined text-tertiary">info</span>
<p class="text-body-md text-on-tertiary-fixed-variant leading-relaxed">
                完善个人资料可以让更多的宠友认识你哦！别忘了上传一张最可爱的头像。
            </p>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="p-5 pb-10 max-w-md mx-auto w-full">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-3xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 marshmallow-shadow">
<span>保存修改</span>
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</footer>
</body></html>
