<!DOCTYPE html>

                    "padding-container": "16px",
                    "gutter-card": "12px",
                    "margin-page": "20px"

            "fontFamily": {
                    "headline-md": ["Quicksand"],
                    "display-title": ["Quicksand"],
                    "body-md": ["Nunito Sans"],
                    "label-caps": ["Plus Jakarta Sans"],
                    "body-lg": ["Nunito Sans"]

            "fontSize": {

<style>
        body {
            background-color: #fff8f7;
            font-family: 'Nunito Sans', sans-serif;
        }
        .healing-shadow {
            box-shadow: 0 8px 32px rgba(168, 155, 157, 0.12);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-blue-text {
            color: #7a8ba8;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-margin-page">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-surface-dim/40 backdrop-blur-sm z-40"></div>
<!-- Main Popup Container -->
<div class="relative z-50 w-full max-w-[320px] bg-[#fffcfb] border-[1.5px] border-primary-fixed/30 rounded-xl healing-shadow overflow-hidden flex flex-col items-center p-6 animate-[bounce_0.5s_ease-out]">
<!-- Dog Avatar Container -->
<div class="relative mb-4">
<div class="w-24 h-24 rounded-full border-[6px] border-primary-fixed/50 overflow-hidden bg-surface-container-low p-0.5">
<img alt="宠物头像" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAabqnN6bpgkBj2eWWNBk_NYMLaHemafD8mniMuRJLXUMbB97hU5yFMQNacMdfXBRrdScPbyM-z-meclEtFjBt9wbuOSXsqFxv_eu-MHafJ7YdnJ8LW0B3-6cZr3L_m6Lo7Jg-AvmE-spzlrHIrrejToOm8Gm7kKxNNovWYsv1UKHEZWQmVVnf5-NSnCDIThBYOUJ8jH1h-hqtNizlpr-Kcr0Yjy65obiRgU6OTDe2XvnLPVBcnSy5AuY5YpHcNvSxEvZlKeDwmbMfa"/>
</div>
<!-- Decorative Icon -->
<div class="absolute -bottom-1 -right-1 bg-primary text-on-primary rounded-full p-1.5 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]" data-icon="pets">pets</span>
</div>
</div>
<!-- Content Section -->
<div class="text-center mb-6 w-full space-y-2">
<h2 class="font-display-title text-display-title text-primary font-bold">贝贝 · 金毛寻回犬</h2>
<!-- Tags -->
<div class="flex flex-wrap justify-center gap-2">
<span class="px-3 py-0.5 bg-secondary-fixed/40 soft-blue-text text-[12px] font-semibold rounded-full">小型 · 温顺</span>
<span class="px-3 py-0.5 bg-secondary-fixed/40 soft-blue-text text-[12px] font-semibold rounded-full">已接种疫苗</span>
</div>
<!-- Location -->
<div class="flex items-center justify-center space-x-1 text-on-surface-variant/80 pt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="location_on">location_on</span>
<span class="font-body-md text-body-md">西湖区 · 文三路片区</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full grid grid-cols-2 gap-3">
<!-- Left Button: 查看主页 (Light Yellow) -->
<button class="flex items-center justify-center py-3 px-2 rounded-full bg-secondary-fixed text-secondary font-headline-md text-headline-md hover:brightness-95 active:scale-95 transition-all duration-200">
                查看主页
            </button>
<!-- Right Button: 发私信 (Light Pink) -->
<button class="flex items-center justify-center py-3 px-2 rounded-full bg-primary-fixed text-primary font-headline-md text-headline-md hover:brightness-95 active:scale-95 transition-all duration-200">
                发私信
            </button>
</div>
<!-- Floating Decoration Particles -->
<div class="absolute top-4 right-4 opacity-10">
<span class="material-symbols-outlined text-primary text-xl" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<!-- Background Decoration to show context -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-40">
<div class="flex justify-between items-center w-full px-5 py-4 max-w-md mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="pets">pets</span>
<span class="font-display-title text-display-title text-primary">WaggleWorld</span>
</div>
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</div>
<div class="p-margin-page grid grid-cols-2 gap-gutter-card max-w-md mx-auto">
<div class="h-40 bg-surface-container rounded-xl"></div>
<div class="h-40 bg-surface-container rounded-xl"></div>
<div class="h-40 bg-surface-container rounded-xl"></div>
<div class="h-40 bg-surface-container rounded-xl"></div>
</div>
