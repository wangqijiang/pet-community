<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;family=Nunito+Sans:wght@300;400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

        darkMode: "class",

                "2xl": "24px",

            }

<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24
        }
        .soft-shadow {
            box-shadow: 0 8px 24px rgba(255, 188, 198, 0.15);
        }
        .bouncy-hover:active {
            transform: scale(0.92);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)
        }
        .map-bg {
            background-color: #e3f2fd; 
            background-image: radial-gradient(#ffffff 2px, transparent 2px);
            background-size: 24px 24px;
        }
        body {
            font-family: 'Quicksand', 'Nunito Sans', sans-serif;
            overflow: hidden;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .panel-transition {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 0.8s ease-out forwards;
        }
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-40px) scale(0.5); opacity: 0; }
        }
        @keyframes bounce-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .nav-active-icon {
            animation: bounce-icon 1s infinite;
            color: #ffbcc6;
        }
    </style>
</head>

<script>
    function togglePanel(show) {
        const panel = document.getElementById('breed-panel');
        if (show) {
            panel.classList.remove('opacity-0', 'pointer-events-none');
            panel.querySelector('div').style.transform = 'translateY(0)';
        } else {
            panel.classList.add('opacity-0', 'pointer-events-none');
            panel.querySelector('div').style.transform = 'translateY(100%)';
        }
    }

    function selectBreed(name) {
        document.getElementById('current-breed').innerText = name;
        togglePanel(false);
    }

    function showHeartEffect(el) {
        const rect = el.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 3; i++) {
            const heart = document.createElement('span');
            heart.innerHTML = '❤️';
            heart.className = 'heart-particle text-[12px]';
            heart.style.left = `${centerX - 6 + (Math.random() * 20 - 10)}px`;
            heart.style.top = `${centerY - 6}px`;
            heart.style.animationDelay = `${i * 0.1}s`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }
    }
</script>
