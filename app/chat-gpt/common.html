<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>宠物社交 UI 组件</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#F2EFEC;
      font-family:'Noto Sans SC',sans-serif;

      display:flex;
      justify-content:center;

      padding:40px;
    }

    .phone{
      width:390px;
      height:844px;

      background:#FFF8F5;

      border-radius:42px;

      overflow:hidden;

      position:relative;

      box-shadow:
      0 24px 60px rgba(0,0,0,0.08);
    }

    .page{
      padding:120px 24px 40px;
    }

    .title{
      position:absolute;

      top:56px;
      left:0;

      width:100%;

      text-align:center;

      font-size:24px;
      font-weight:800;

      color:#6B4E3D;
    }

    .demo-list{
      display:flex;
      flex-direction:column;

      gap:18px;
    }

    .demo-btn{
      height:58px;

      border:none;

      border-radius:22px;

      background:white;

      font-size:16px;
      font-weight:700;

      color:#6B5B5B;

      box-shadow:
      0 10px 24px rgba(107,78,61,0.06);

      transition:all .2s ease;
    }

    .demo-btn:hover{
      transform:translateY(-2px);
    }

    .primary{
      background:
      linear-gradient(
      135deg,
      #8B6D73,
      #7A5C62
      );

      color:white;
    }

    /* 遮罩 */

    .mask{
      position:absolute;

      inset:0;

      background:rgba(0,0,0,0.25);

      backdrop-filter:blur(8px);

      display:none;

      align-items:center;
      justify-content:center;

      z-index:100;
    }

    .mask.show{
      display:flex;
    }

    /* 弹窗 */

    .modal{
      width:320px;

      background:white;

      border-radius:34px;

      padding:28px 24px 24px;

      box-shadow:
      0 20px 50px rgba(0,0,0,0.12);

      animation:popup .2s ease;
    }

    @keyframes popup{
      from{
        transform:scale(.92);
        opacity:0;
      }

      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .modal-icon{
      width:72px;
      height:72px;

      border-radius:24px;

      margin:0 auto 20px;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .icon-success{
      background:#EAF8EC;
      color:#64B76A;
    }

    .icon-warning{
      background:#FFF3E8;
      color:#F4A259;
    }

    .icon-delete{
      background:#FFE8EA;
      color:#E26D6D;
    }

    .modal-title{
      text-align:center;

      font-size:22px;
      font-weight:800;

      color:#4B3A3A;
    }

    .modal-desc{
      margin-top:12px;

      text-align:center;

      font-size:14px;

      line-height:1.9;

      color:#9A8F8F;
    }

    .modal-actions{
      margin-top:28px;

      display:flex;
      gap:12px;
    }

    .action-btn{
      flex:1;

      height:52px;

      border:none;

      border-radius:18px;

      font-size:15px;
      font-weight:700;
    }

    .btn-light{
      background:#F7F2EF;
      color:#7A6E6E;
    }

    .btn-primary{
      background:
      linear-gradient(
      135deg,
      #FFB36B,
      #FFA45C
      );

      color:white;
    }

    .btn-danger{
      background:
      linear-gradient(
      135deg,
      #F58B8B,
      #EB6F6F
      );

      color:white;
    }

    /* loading */

    .loading-box{
      width:180px;

      background:white;

      border-radius:30px;

      padding:32px 24px;

      display:flex;
      flex-direction:column;
      align-items:center;

      box-shadow:
      0 20px 50px rgba(0,0,0,0.12);
    }

    .loader{
      width:54px;
      height:54px;

      border-radius:999px;

      border:5px solid #F5E7DF;

      border-top-color:#8B6D73;

      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .loading-text{
      margin-top:20px;

      font-size:15px;
      font-weight:700;

      color:#6B5B5B;
    }

    /* toast */

    .toast{
      position:absolute;

      left:50%;
      bottom:120px;

      transform:translateX(-50%);

      min-width:220px;

      background:rgba(50,40,40,0.92);

      color:white;

      padding:18px 22px;

      border-radius:22px;

      display:none;
      align-items:center;
      gap:12px;

      backdrop-filter:blur(10px);

      z-index:200;
    }

    .toast.show{
      display:flex;
    }

    .toast i{
      color:#8ED39B;
    }

    .toast-text{
      font-size:14px;
      font-weight:600;
    }

  </style>
</head>

<body>

  <div class="phone">

    <div class="title">
      Pet UI 组件设计
    </div>

    <div class="page">

      <div class="demo-list">

        <button
        class="demo-btn primary"
        onclick="showSuccess()">
          成功弹框
        </button>

        <button
        class="demo-btn"
        onclick="showConfirm()">
          确认弹框
        </button>

        <button
        class="demo-btn"
        onclick="showDelete()">
          删除确认框
        </button>

        <button
        class="demo-btn"
        onclick="showLoading()">
          Loading 加载
        </button>

        <button
        class="demo-btn"
        onclick="showToast()">
          Toast 提示
        </button>

      </div>

    </div>

    <!-- 成功弹框 -->

    <div class="mask" id="successModal">

      <div class="modal">

        <div class="modal-icon icon-success">
          <i data-lucide="check"></i>
        </div>

        <div class="modal-title">
          发布成功
        </div>

        <div class="modal-desc">
          你的萌宠动态已经发布成功啦，快去看看有没有新的点赞和评论吧 🐾
        </div>

        <div class="modal-actions">

          <button
          class="action-btn btn-primary"
          onclick="closeModal('successModal')">
            我知道啦
          </button>

        </div>

      </div>

    </div>

    <!-- 确认框 -->

    <div class="mask" id="confirmModal">

      <div class="modal">

        <div class="modal-icon icon-warning">
          <i data-lucide="sparkles"></i>
        </div>

        <div class="modal-title">
          确认提交？
        </div>

        <div class="modal-desc">
          确认后将会发布到萌宠圈，所有好友都可以看到哦～
        </div>

        <div class="modal-actions">

          <button
          class="action-btn btn-light"
          onclick="closeModal('confirmModal')">
            取消
          </button>

          <button
          class="action-btn btn-primary"
          onclick="closeModal('confirmModal')">
            确认
          </button>

        </div>

      </div>

    </div>

    <!-- 删除框 -->

    <div class="mask" id="deleteModal">

      <div class="modal">

        <div class="modal-icon icon-delete">
          <i data-lucide="trash-2"></i>
        </div>

        <div class="modal-title">
          删除动态？
        </div>

        <div class="modal-desc">
          删除后无法恢复，评论与点赞记录也会一起清空。
        </div>

        <div class="modal-actions">

          <button
          class="action-btn btn-light"
          onclick="closeModal('deleteModal')">
            取消
          </button>

          <button
          class="action-btn btn-danger"
          onclick="closeModal('deleteModal')">
            删除
          </button>

        </div>

      </div>

    </div>

    <!-- Loading -->

    <div class="mask" id="loadingModal">

      <div class="loading-box">

        <div class="loader"></div>

        <div class="loading-text">
          正在加载中...
        </div>

      </div>

    </div>

    <!-- Toast -->

    <div class="toast" id="toast">

      <i data-lucide="check-circle"></i>

      <div class="toast-text">
        收藏成功～
      </div>

    </div>

  </div>

  <script>

    lucide.createIcons();

    function showSuccess(){
      document
      .getElementById('successModal')
      .classList.add('show');
    }

    function showConfirm(){
      document
      .getElementById('confirmModal')
      .classList.add('show');
    }

    function showDelete(){
      document
      .getElementById('deleteModal')
      .classList.add('show');
    }

    function showLoading(){

      const modal =
      document.getElementById('loadingModal');

      modal.classList.add('show');

      setTimeout(()=>{
        modal.classList.remove('show');
      },2000);
    }

    function showToast(){

      const toast =
      document.getElementById('toast');

      toast.classList.add('show');

      setTimeout(()=>{
        toast.classList.remove('show');
      },2200);
    }

    function closeModal(id){
      document
      .getElementById(id)
      .classList.remove('show');
    }

  </script>

</body>
</html>
