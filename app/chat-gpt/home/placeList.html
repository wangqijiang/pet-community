<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>遛狗好去处</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#F3F1EE;
      font-family:'Noto Sans SC',sans-serif;

      display:flex;
      justify-content:center;

      padding:40px;
    }

    .phone{
      width:390px;
      min-height:844px;

      background:#FFF7F1;

      border-radius:42px;

      overflow:hidden;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.08);
    }

    .topbar{
      height:92px;

      padding:52px 20px 0;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:rgba(255,247,241,0.88);

      backdrop-filter:blur(20px);

      border-bottom:
      1px solid rgba(0,0,0,0.03);
    }

    .back-btn{
      width:40px;
      height:40px;

      border-radius:999px;

      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
      0 4px 12px rgba(107,78,61,0.08);
    }

    .title{
      font-size:20px;
      font-weight:700;
      color:#5E4636;
    }

    .tabs{
      display:flex;
      gap:10px;

      overflow-x:auto;

      padding:16px;

      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      padding:10px 18px;

      border-radius:999px;

      background:white;

      color:#8A7F7F;

      font-size:13px;

      white-space:nowrap;

      border:
      1px solid #F1E5DA;
    }

    .tab.active{
      background:#FFD8E9;
      border:none;
      color:#D46E9B;
      font-weight:600;
    }

    .list{
      padding:0 16px 32px;
    }

    .card{
      background:white;

      border-radius:24px;

      overflow:hidden;

      margin-bottom:18px;

      box-shadow:
      0 8px 24px rgba(107,78,61,0.06);
    }

    .cover{
      width:100%;
      height:200px;
      object-fit:cover;
    }

    .content{
      padding:18px;
    }

    .tag{
      display:inline-flex;

      padding:6px 12px;

      border-radius:999px;

      background:#FFF0F6;

      color:#D46E9B;

      font-size:12px;

      margin-bottom:12px;
    }

    .name{
      font-size:22px;
      font-weight:700;

      color:#3D2F2F;
    }

    .desc{
      margin-top:8px;

      color:#7A6E6E;

      line-height:1.8;

      font-size:14px;
    }

    .meta{
      margin-top:16px;

      display:flex;
      gap:18px;

      color:#9B8F8F;

      font-size:13px;
    }

    .meta-item{
      display:flex;
      align-items:center;
      gap:6px;
    }

  </style>
</head>

<body>

  <div class="phone">

    <div class="topbar">

      <div class="back-btn">
        <i data-lucide="chevron-left"></i>
      </div>

      <div class="title">
        遛狗好去处
      </div>

      <div class="back-btn">
        <i data-lucide="ellipsis"></i>
      </div>

    </div>

    <div class="tabs">

      <div class="tab active">
        全部
      </div>

      <div class="tab">
        公园
      </div>

      <div class="tab">
        宠物乐园
      </div>

      <div class="tab">
        宠物店
      </div>

      <div class="tab">
        咖啡厅
      </div>

    </div>

    <div class="list">

      <div class="card">

        <img class="cover"
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">

        <div class="content">

          <div class="tag">
            公园
          </div>

          <div class="name">
            中央公园
          </div>

          <div class="desc">
            草坪非常大，很适合带狗狗奔跑，傍晚阳光特别舒服。
          </div>

          <div class="meta">

            <div class="meta-item">
              <i data-lucide="star"></i>
              4.9
            </div>

            <div class="meta-item">
              <i data-lucide="map-pin"></i>
              500m
            </div>

            <div class="meta-item">
              <i data-lucide="paw-print"></i>
              23只宠物
            </div>

          </div>

        </div>

      </div>

      <div class="card">

        <img class="cover"
        src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?q=80&w=1200&auto=format&fit=crop">

        <div class="content">

          <div class="tag">
            宠物乐园
          </div>

          <div class="name">
            萌宠乐园
          </div>

          <div class="desc">
            有障碍区和互动区域，适合社交型狗狗一起玩耍。
          </div>

          <div class="meta">

            <div class="meta-item">
              <i data-lucide="star"></i>
              4.8
            </div>

            <div class="meta-item">
              <i data-lucide="map-pin"></i>
              1.2km
            </div>

            <div class="meta-item">
              <i data-lucide="paw-print"></i>
              15只宠物
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
