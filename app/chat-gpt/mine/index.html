<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>我的页面</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#F3F1EE;
      font-family:'Noto Sans SC',sans-serif;

      display:flex;
      justify-content:center;

      padding:40px;
    }

    .phone{
      width:390px;
      height:844px;

      background:#FFF7F1;

      border-radius:42px;

      overflow:hidden;

      position:relative;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.08);
    }

    .topbar{
      height:92px;

      padding:52px 20px 0;

      display:flex;
      justify-content:flex-end;
      align-items:center;

      background:rgba(255,247,241,0.88);

      backdrop-filter:blur(20px);

      position:relative;

      z-index:5;
    }

    .action-group{
      display:flex;
      gap:10px;
    }

    .action-btn{
      width:40px;
      height:40px;

      border-radius:999px;

      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
      0 4px 12px rgba(107,78,61,0.08);

      color:#6B5B5B;
    }

    .content{
      height:calc(100% - 92px);

      overflow-y:auto;

      padding:
      0 16px 120px;
    }

    .profile-card{
      background:
      linear-gradient(
      135deg,
      rgba(255,255,255,0.92),
      rgba(255,250,246,0.92)
      );

      border-radius:32px;

      padding:24px;

      box-shadow:
      0 12px 32px rgba(107,78,61,0.06);
    }

    .user-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .user-left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .avatar{
      width:82px;
      height:82px;

      border-radius:28px;

      object-fit:cover;

      border:
      4px solid rgba(255,255,255,0.8);
    }

    .name{
      font-size:28px;
      font-weight:700;

      color:#3D2F2F;
    }

    .desc{
      margin-top:8px;

      color:#8A7F7F;

      font-size:14px;
    }

    .edit-btn{
      width:42px;
      height:42px;

      border-radius:16px;

      background:#FFF0E0;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#F4A259;
    }

    .stats{
      margin-top:24px;

      background:white;

      border-radius:24px;

      padding:20px 10px;

      display:flex;
      justify-content:space-around;

      box-shadow:
      0 8px 24px rgba(107,78,61,0.04);
    }

    .stat{
      flex:1;

      text-align:center;

      position:relative;
    }

    .stat:not(:last-child)::after{
      content:'';

      position:absolute;

      right:0;
      top:50%;

      transform:translateY(-50%);

      width:1px;
      height:42px;

      background:#F2E7E0;
    }

    .num{
      font-size:24px;
      font-weight:700;

      color:#6B4E3D;
    }

    .label{
      margin-top:6px;

      font-size:12px;

      color:#9B9090;
    }

    .section{
      margin-top:28px;
    }

    .section-header{
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin-bottom:16px;
    }

    .section-title{
      font-size:26px;
      font-weight:700;

      color:#3D2F2F;
    }

    .more{
      font-size:13px;

      color:#A49797;
    }

    .pet-list{
      display:flex;
      gap:14px;

      overflow-x:auto;

      padding-bottom:4px;

      scrollbar-width:none;
    }

    .pet-list::-webkit-scrollbar{
      display:none;
    }

    .pet-card{
      min-width:150px;

      background:white;

      border-radius:28px;

      padding:18px;

      box-shadow:
      0 10px 28px rgba(107,78,61,0.05);
    }

    .pet-avatar{
      width:72px;
      height:72px;

      border-radius:24px;

      object-fit:cover;
    }

    .pet-name{
      margin-top:16px;

      font-size:18px;
      font-weight:700;

      color:#3D2F2F;
    }

    .pet-info{
      margin-top:6px;

      font-size:13px;

      color:#9B9090;
    }

    .add-card{
      min-width:150px;

      border-radius:28px;

      border:
      2px dashed #F2D7C3;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      color:#B8A7A7;

      background:
      rgba(255,255,255,0.4);
    }

    .add-icon{
      width:54px;
      height:54px;

      border-radius:20px;

      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
      0 8px 20px rgba(107,78,61,0.05);

      margin-bottom:14px;
    }

    .ai-card{
      margin-top:24px;

      border-radius:32px;

      padding:24px;

      background:
      linear-gradient(
      135deg,
      #FFEFE4,
      #FFF9E9
      );

      position:relative;

      overflow:hidden;
    }

    .ai-light{
      position:absolute;

      width:180px;
      height:180px;

      border-radius:999px;

      background:
      radial-gradient(
      circle,
      rgba(255,255,255,0.45) 0%,
      rgba(255,255,255,0) 70%
      );

      top:-80px;
      right:-60px;
    }

    .ai-title{
      font-size:24px;
      font-weight:700;

      color:#5E4636;

      position:relative;
      z-index:2;
    }

    .ai-desc{
      margin-top:10px;

      line-height:1.8;

      color:#8A7F7F;

      font-size:14px;

      position:relative;
      z-index:2;
    }

    .ai-btn{
      margin-top:22px;

      width:100%;
      height:52px;

      border:none;

      border-radius:999px;

      background:#8B6D73;

      color:white;

      font-size:15px;
      font-weight:700;

      box-shadow:
      0 10px 24px rgba(139,109,115,0.2);

      position:relative;
      z-index:2;

      transition:all .2s ease;
    }

    .ai-btn:hover{
      transform:scale(1.02);
    }

    .logout-btn{
      margin-top:30px;

      width:100%;
      height:56px;

      border:none;

      border-radius:999px;

      background:white;

      color:#E26D6D;

      font-size:16px;
      font-weight:700;

      box-shadow:
      0 8px 24px rgba(107,78,61,0.05);
    }

    .tabbar{
      position:absolute;

      bottom:0;
      left:0;

      width:100%;
      height:92px;

      background:rgba(255,255,255,0.9);

      backdrop-filter:blur(20px);

      border-top:
      1px solid rgba(0,0,0,0.03);

      display:flex;
      justify-content:space-around;
      align-items:center;

      padding-bottom:16px;
    }

    .tab-item{
      display:flex;
      flex-direction:column;
      align-items:center;

      gap:4px;

      color:#8A7F7F;

      font-size:11px;
    }

    .tab-item.active{
      color:#F4A259;
      font-weight:600;
    }

    .message-badge{
      position:absolute;

      top:-4px;
      right:-8px;

      width:18px;
      height:18px;

      border-radius:999px;

      background:#E54B4B;

      color:white;

      font-size:11px;
      font-weight:700;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .icon-box{
      position:relative;
    }

  </style>
</head>

<body>

  <div class="phone">

    <div class="topbar">

      <div class="action-group">

        <div class="action-btn">
          <i data-lucide="ellipsis"></i>
        </div>

        <div class="action-btn">
          <i data-lucide="settings-2"></i>
        </div>

      </div>

    </div>

    <div class="content">

      <div class="profile-card">

        <div class="user-row">

          <div class="user-left">

            <img
            class="avatar"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400&auto=format&fit=crop"
            />

            <div>

              <div class="name">
                Summer Lin
              </div>

              <div class="desc">
                和布丁一起探索城市 🐾
              </div>

            </div>

          </div>

          <div class="edit-btn">
            <i data-lucide="square-pen"></i>
          </div>

        </div>

        <div class="stats">

          <div class="stat">

            <div class="num">
              24
            </div>

            <div class="label">
              动态
            </div>

          </div>

          <div class="stat">

            <div class="num">
              1.2k
            </div>

            <div class="label">
              关注
            </div>

          </div>

          <div class="stat">

            <div class="num">
              856
            </div>

            <div class="label">
              粉丝
            </div>

          </div>

        </div>

      </div>

      <div class="section">

        <div class="section-header">

          <div class="section-title">
            我的宠物
          </div>

          <div class="more">
            查看全部
          </div>

        </div>

        <div class="pet-list">

          <div class="pet-card">

            <img
            class="pet-avatar"
            src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=400&auto=format&fit=crop"
            />

            <div class="pet-name">
              芝士
            </div>

            <div class="pet-info">
              1岁 · 柴犬
            </div>

          </div>

          <div class="add-card">

            <div class="add-icon">
              <i data-lucide="plus"></i>
            </div>

            <div>
              添加宠物
            </div>

          </div>

        </div>

      </div>

      <div class="ai-card">

        <div class="ai-light"></div>

        <div class="ai-title">
          需要养宠建议吗？
        </div>

        <div class="ai-desc">
          AI 为你生成今日遛狗推荐、天气提醒和宠物陪伴建议 ✨
        </div>

        <button class="ai-btn">

          <i data-lucide="sparkles"></i>

          一键生成建议

        </button>

      </div>

      <button class="logout-btn">
        退出登录
      </button>

    </div>

    <div class="tabbar">

      <div class="tab-item">
        <i data-lucide="house"></i>
        首页
      </div>

      <div class="tab-item">
        <i data-lucide="paw-print"></i>
        萌宠圈
      </div>

      <div class="tab-item">

        <div class="icon-box">

          <i data-lucide="message-circle"></i>

          <div class="message-badge">
            2
          </div>

        </div>

        消息

      </div>

      <div class="tab-item active">
        <i data-lucide="user-round"></i>
        我的
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
