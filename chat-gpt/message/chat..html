<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>聊天页面</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#F3F1EE;
      font-family:'Noto Sans SC',sans-serif;

      display:flex;
      justify-content:center;

      padding:40px;
    }

    .phone{
      width:390px;
      height:844px;

      background:#FFF7F1;

      border-radius:42px;

      overflow:hidden;

      position:relative;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.08);
    }

    .topbar{
      height:92px;

      padding:52px 20px 0;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:rgba(255,247,241,0.92);

      backdrop-filter:blur(20px);

      border-bottom:
      1px solid rgba(0,0,0,0.03);
    }

    .top-left{
      width:40px;

      display:flex;
      align-items:center;
    }

    .back-btn{
      color:#7A6E6E;
    }

    .title{
      font-size:20px;
      font-weight:700;

      color:#5E4636;
    }

    .action-btn{
      width:40px;
      height:40px;

      border-radius:999px;

      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
      0 4px 12px rgba(107,78,61,0.08);
    }

    .chat-area{
      height:calc(100% - 172px);

      overflow-y:auto;

      padding:
      20px 18px 40px;
    }

    .message{
      display:flex;

      margin-bottom:22px;
    }

    .message.left{
      justify-content:flex-start;
    }

    .message.right{
      justify-content:flex-end;
    }

    .message-wrap{
      display:flex;
      align-items:flex-end;
      gap:10px;

      max-width:78%;
    }

    .message.right .message-wrap{
      flex-direction:row-reverse;
    }

    .avatar{
      width:42px;
      height:42px;

      border-radius:16px;

      object-fit:cover;

      flex-shrink:0;
    }

    .bubble-group{
      display:flex;
      flex-direction:column;
    }

    .bubble{
      padding:14px 16px;

      border-radius:22px;

      font-size:15px;

      line-height:1.7;

      position:relative;

      word-break:break-word;
    }

    .message.left .bubble{
      background:white;

      color:#4D3E3E;

      border-bottom-left-radius:8px;

      box-shadow:
      0 6px 18px rgba(107,78,61,0.05);
    }

    .message.right .bubble{
      background:#8B6D73;

      color:white;

      border-bottom-right-radius:8px;

      box-shadow:
      0 8px 20px rgba(139,109,115,0.22);
    }

    .time{
      margin-top:6px;

      font-size:11px;

      color:#B0A6A6;
    }

    .message.right .time{
      text-align:right;
    }

    .input-area{
      position:absolute;

      left:0;
      bottom:0;

      width:100%;
      height:80px;

      background:rgba(255,255,255,0.9);

      backdrop-filter:blur(20px);

      border-top:
      1px solid rgba(0,0,0,0.03);

      padding:12px 16px 20px;

      display:flex;
      align-items:center;
      gap:12px;
    }

    .input-icon{
      width:36px;
      height:36px;

      border-radius:12px;

      background:#FFF2EA;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#8B6D73;

      flex-shrink:0;
    }

    .input-box{
      flex:1;

      height:44px;

      border:none;

      border-radius:999px;

      background:#F7F1EE;

      padding:0 18px;

      font-size:14px;

      outline:none;

      color:#4D3E3E;
    }

    .send-btn{
      height:40px;

      padding:0 18px;

      border:none;

      border-radius:999px;

      background:#FFB36B;

      color:white;

      font-size:14px;
      font-weight:600;

      box-shadow:
      0 8px 20px rgba(255,179,107,0.25);

      cursor:pointer;

      transition:all .2s ease;
    }

    .send-btn:hover{
      transform:scale(1.03);
    }

  </style>
</head>

<body>

  <div class="phone">

    <div class="topbar">

      <div class="top-left">

        <div class="back-btn">
          <i data-lucide="chevron-left"></i>
        </div>

      </div>

      <div class="title">
        小明
      </div>

      <div class="action-btn">
        <i data-lucide="ellipsis"></i>
      </div>

    </div>

    <div class="chat-area">

      <!-- 左 -->

      <div class="message left">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              你好呀！🐶
            </div>

            <div class="time">
              10:00
            </div>

          </div>

        </div>

      </div>

      <!-- 右 -->

      <div class="message right">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              你好呀！今天出去遛狗吗？
            </div>

            <div class="time">
              10:01
            </div>

          </div>

        </div>

      </div>

      <!-- 左 -->

      <div class="message left">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              今天不下雨，要不要一起去公园？
            </div>

            <div class="time">
              10:02
            </div>

          </div>

        </div>

      </div>

      <!-- 右 -->

      <div class="message right">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              好呀！去哪边？
            </div>

            <div class="time">
              10:03
            </div>

          </div>

        </div>

      </div>

      <!-- 左 -->

      <div class="message left">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              中央公园吧，那边草坪大～
            </div>

            <div class="time">
              10:05
            </div>

          </div>

        </div>

      </div>

      <!-- 右 -->

      <div class="message right">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              可以，几点？
            </div>

            <div class="time">
              10:06
            </div>

          </div>

        </div>

      </div>

      <!-- 左 -->

      <div class="message left">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              下午三点怎么样？
            </div>

            <div class="time">
              10:08
            </div>

          </div>

        </div>

      </div>

      <!-- 右 -->

      <div class="message right">

        <div class="message-wrap">

          <img
          class="avatar"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
          />

          <div class="bubble-group">

            <div class="bubble">
              没问题，到时见！🐾
            </div>

            <div class="time">
              10:10
            </div>

          </div>

        </div>

      </div>

    </div>

    <div class="input-area">

      <div class="input-icon">
        <i data-lucide="plus"></i>
      </div>

      <div class="input-icon">
        <i data-lucide="image"></i>
      </div>

      <input
      class="input-box"
      placeholder="输入消息..."
      />

      <button class="send-btn">
        发送
      </button>

    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
