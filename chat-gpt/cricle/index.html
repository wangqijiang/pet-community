<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>萌宠朋友圈 UI Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #f3f1ee;
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .phone {
      width: 390px;
      min-height: 844px;
      background: #FFF7F1;
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      position: relative;
    }

    .topbar {
      height: 92px;
      padding: 52px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,247,241,0.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #6B4E3D;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(107,78,61,0.08);
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 10px 16px;
      background: white;
      border-radius: 999px;
      color: #7A6E6E;
      white-space: nowrap;
      font-size: 13px;
    }

    .tab.active {
      background: #FFE2C2;
      color: #D97D2F;
      font-weight: 600;
    }

    .feed {
      padding: 0 16px 120px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(107,78,61,0.06);
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      object-fit: cover;
    }

    .username {
      font-size: 16px;
      font-weight: 700;
      color: #3D2F2F;
    }

    .meta {
      font-size: 12px;
      color: #9B9090;
      margin-top: 2px;
    }

    .level {
      background: #FFF0D9;
      color: #E49743;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-left: 8px;
      font-weight: 600;
    }

    .content {
      margin-top: 14px;
      line-height: 1.8;
      color: #4D3E3E;
      font-size: 15px;
    }

    .gallery {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 16px;
    }

    .location {
      margin-top: 14px;
      background: #FFF5EA;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7B5B45;
      font-size: 14px;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7A6E6E;
      font-size: 14px;
    }

    .action-left {
      display: flex;
      gap: 18px;
    }

    .action-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 92px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.04);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 16px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #7A6E6E;
    }

    .tab-item.active {
      color: #F4A259;
      font-weight: 600;
    }

    .fab {
      position: absolute;
      right: 20px;
      bottom: 110px;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: linear-gradient(135deg, #FFB36B, #FFA552);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 24px rgba(255,179,107,0.4);
    }
  </style>
</head>
<body>
  <div class="phone">

    <div class="topbar">
      <div style="width:40px"></div>

      <div class="title">
        萌宠朋友圈 🐾
      </div>

      <div class="icon-btn">
        <i data-lucide="ellipsis"></i>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">全部动态</div>
      <div class="tab">修狗日常</div>
      <div class="tab">遛狗搭子</div>
      <div class="tab">宠物友好店</div>
      <div class="tab">萌宠日常</div>
    </div>

    <div class="feed">

      <div class="card">
        <div class="user-row">

          <div class="user-left">
            <img class="avatar" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=400&auto=format&fit=crop" />

            <div>
              <div>
                <span class="username">布丁麻麻</span>
                <span class="level">Lv.2</span>
              </div>

              <div class="meta">20分钟前 · 杭州</div>
            </div>
          </div>

          <i data-lucide="more-horizontal"></i>
        </div>

        <div class="content">
          今天带布丁去公园撒欢啦！<br>
          秋天的草地太舒服了，它开心得像个小疯子～🍂🐶
        </div>

        <div class="gallery">
          <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=600&auto=format&fit=crop" />
          <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?q=80&w=600&auto=format&fit=crop" />
          <img src="https://images.unsplash.com/photo-1525253086316-d0c936c814f8?q=80&w=600&auto=format&fit=crop" />
          <img src="https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=600&auto=format&fit=crop" />
        </div>

        <div class="location">
          <div style="display:flex;align-items:center;gap:8px;">
            <i data-lucide="map-pin" style="width:16px;height:16px"></i>
            西湖边 · 太子湾公园
          </div>

          <div>2.3km</div>
        </div>

        <div class="actions">
          <div class="action-left">
            <div class="action-item">
              <i data-lucide="heart"></i>
              96
            </div>

            <div class="action-item">
              <i data-lucide="message-circle"></i>
              18
            </div>
          </div>

          <i data-lucide="share-2"></i>
        </div>
      </div>

    </div>

    <div class="fab">
      <i data-lucide="plus"></i>
    </div>

    <div class="tabbar">
      <div class="tab-item">
        <i data-lucide="house"></i>
        首页
      </div>

      <div class="tab-item">
        <i data-lucide="map-pinned"></i>
        地图
      </div>

      <div class="tab-item active">
        <i data-lucide="paw-print"></i>
        动态
      </div>

      <div class="tab-item">
        <i data-lucide="message-circle"></i>
        消息
      </div>

      <div class="tab-item">
        <i data-lucide="user-round"></i>
        我的
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
